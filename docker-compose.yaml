name: jambi-wind-lk09

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - wind-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 180s


  # LK10: built separately with `mlflow models build-docker`.
  # Three replicas share a model image; each gets a random loopback host port.
  model-serving:
    image: jambi-wind-lk10-mlflow:latest
    restart: unless-stopped
    environment:
      MLFLOW_MODELS_WORKERS: '1'
    networks:
    - wind-network
    ports:
    - target: 8080
      host_ip: 127.0.0.1
      protocol: tcp
    - target: 8081
      host_ip: 127.0.0.1
      protocol: tcp
    deploy:
      replicas: 3
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/ping',
        timeout=3)
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    entrypoint:
    - python
    - /opt/lk11_proxy.py
    - python
    - -c
    - from mlflow.models import container as C; C._serve('virtualenv')
    command: []
    volumes:
    - ./monitoring/lk11_proxy.py:/opt/lk11_proxy.py:ro
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=2d
    ports:
    - 127.0.0.1:9090:9090
    networks:
    - wind-network
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./monitoring/lk11-rules.yml:/etc/prometheus/lk11-rules.yml:ro
    - prometheus_data:/prometheus
  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    ports:
    - 127.0.0.1:3000:3000
    networks:
    - wind-network
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${LK11_GRAFANA_PASSWORD:?set LK11_GRAFANA_PASSWORD
        in .env}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    depends_on:
    - prometheus
    volumes:
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana_data:/var/lib/grafana

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:

networks:
  wind-network:
    driver: bridge
