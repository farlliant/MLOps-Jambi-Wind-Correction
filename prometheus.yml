global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/lk11-rules.yml
scrape_configs:
  - job_name: mlflow-model
    metrics_path: /metrics
    dns_sd_configs:
      - names: [model-serving]
        type: A
        port: 8081
        refresh_interval: 5s
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
